<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SENTINEL Carte</title>
<meta name="theme-color" content="#11151a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{--bg:#11151a;--panel:#1a2027;--line:#2a323c;--txt:#e8edf2;--dim:#8b96a3;
        --acc:#e5484d;--bou:#e5484d;--pan:#f5a524;--trv:#c9d2db;--fer:#9b6cf0;--info:#3e9bf0;--ok:#30a46c}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  #bar{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
  #bar h1{font-size:17px;margin:0;letter-spacing:.5px;font-weight:700}
  #dot{width:10px;height:10px;border-radius:50%;background:var(--dim)}
  #dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  #dot.off{background:var(--acc)}
  #vie{font-size:11px;color:var(--dim);margin-top:1px}
  #vie.ok{color:var(--ok)} #vie.ko{color:var(--acc);font-weight:700}
  #count{margin-left:auto;color:var(--dim);font-size:14px}
  .btn{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:10px;
    padding:8px 12px;font-size:14px;cursor:pointer}
  #map{position:fixed;top:56px;left:0;right:0;bottom:0;top:calc(env(safe-area-inset-top) + 56px)}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:1000;background:var(--panel);
    border-top:1px solid var(--line);border-radius:16px 16px 0 0;max-height:45vh;display:flex;flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom)}
  #sheet.closed #list{display:none}
  #handle{padding:10px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600}
  #handle span{margin-left:auto;color:var(--dim);font-weight:400;font-size:13px}
  #list{overflow-y:auto;border-top:1px solid var(--line)}
  .row{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .row:active{background:#232b34}
  .row .t{flex:1;min-width:0}
  .row .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .t small{color:var(--dim)}
  .row .d{color:var(--dim);font-size:13px;white-space:nowrap}
  .tag{flex:none;min-width:58px;text-align:center;font-size:12px;font-weight:700;border-radius:6px;padding:3px 5px;color:#111}
  .pin{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;
    font-size:16px;line-height:1;border:3px solid;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.5)}
  .sens{position:absolute;left:-15px;top:-15px;width:68px;height:68px;pointer-events:none}
  .sens span{position:absolute;left:50%;top:-4px;transform:translateX(-50%);color:#e5484d;font-size:18px;
    text-shadow:0 0 3px #fff,0 0 3px #fff}
  .dirtag{position:absolute;left:50%;top:42px;transform:translateX(-50%);white-space:nowrap;background:#e5484d;color:#fff;
    font:700 12px system-ui,sans-serif;padding:2px 7px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  .pin.big{width:38px;height:38px;font-size:20px;animation:pulse 1.6s infinite}
  .pin.calm{border-radius:6px;opacity:.9}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(229,72,77,.7)}50%{box-shadow:0 0 0 9px rgba(229,72,77,0)}}
  .me{width:16px;height:16px;border-radius:50%;background:var(--info);border:3px solid #fff;box-shadow:0 0 0 6px rgba(62,155,240,.25)}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--txt)}
  .leaflet-popup-content{margin:12px 14px;font-size:14px}
  .pop h3{margin:0 0 4px;font-size:15px}
  .pop .span{display:inline-block;margin:2px 0 6px;padding:3px 8px;border-radius:6px;background:#2a323c;font-weight:700}
  .pop p{margin:6px 0;color:#c9d2db}
  .pop .when{color:var(--dim);font-size:12px}
  .pop a{display:inline-block;margin-top:6px;color:#111;background:var(--ok);padding:6px 10px;border-radius:8px;text-decoration:none;font-weight:600}
  #reglages{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 62px);z-index:1100;display:none;
    flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    box-shadow:0 6px 20px rgba(0,0,0,.5);font-size:15px}
  #reglages.ouvert{display:flex}
  #reglages label{display:flex;align-items:center;gap:10px;cursor:pointer}
  #reglages input{width:22px;height:22px;accent-color:var(--ok)}
  #setup{position:fixed;inset:0;z-index:2000;background:var(--bg);display:none;flex-direction:column;
    justify-content:center;padding:24px;gap:14px}
  #setup input{font-size:16px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--txt)}
  #setup p{color:var(--dim);margin:0}
  .empty{padding:16px 14px;color:var(--dim)}
  .fond{filter:grayscale(1) brightness(1.04)}
  .leaflet-bottom{bottom:calc(env(safe-area-inset-bottom) + 50px)}
</style>
</head>
<body>
<div id="bar">
  <div id="dot" title="Connexion"></div>
  <div><h1>SENTINEL</h1><div id="vie">…</div></div>
  <div id="count">…</div>
  <button class="btn" id="voix" title="Annonces vocales">🔇</button>
  <button class="btn" id="locate" title="Ma position">◎</button>
</div>
<div id="reglages">
  <label><input type="checkbox" id="rNouv"> Annoncer les nouvelles alertes urgentes</label>
  <label><input type="checkbox" id="rAppr"> Alerte d'approche (5 km)</label>
</div>
<div id="map"></div>
<div id="sheet" class="closed">
  <div id="handle">Incidents en cours <span id="sort">▲ ouvrir</span></div>
  <div id="list"></div>
</div>
<div id="setup">
  <h1 style="margin:0">SENTINEL Carte</h1>
  <p>Nom du canal ntfy (une seule fois, il reste sur cet appareil) :</p>
  <input id="topic" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="Nom du canal">
  <button class="btn" id="save" style="padding:12px;font-size:16px">Valider</button>
</div>

<script>
"use strict";
// ---------- Réglages ----------
const COLORS = {ACC:"--acc",FEU:"--acc",BOU:"--bou",PAN:"--pan",OBS:"--pan",AN:"--pan",
                TRV:"--trv",RED:"--trv",FER:"--fer",INFO:"--info"};
const NAMES  = {ACC:"Accident",FEU:"Incendie",BOU:"Bouchon",PAN:"Panne",OBS:"Obstacle",AN:"Animal",
                TRV:"Travaux",RED:"Réduction de voies",FER:"Fermeture",INFO:"Info"};
const URGENT = new Set(["ACC","FEU","BOU","FER"]);
const EMOJI  = {ACC:"💥",FEU:"🔥",BOU:"🚗",PAN:"🚙",OBS:"⚠️",AN:"🦌",TRV:"🚧",RED:"🚧",FER:"⛔",INFO:"ℹ️"};
const ico = c => EMOJI[c] || "ℹ️";
const KEEP_MS = 7*24*3600e3, KEEP_BOU_MS = 6*3600e3;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = c => css(COLORS[c] || "--info");

// ---------- Etat (garde sur l'appareil) ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let S = store.get("sentinel_state", {items:{}, closed:{}, seen:[], lastId:null});
const seen = new Set(S.seen);
const save = () => { S.seen = [...seen].slice(-600); store.set("sentinel_state", S); };

// ---------- Lecture des messages SENTINEL ----------
const coordsOf = t => { const m = /q=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/.exec(t||""); return m ? [+m[1], +m[2]] : null; };
const tagOf = line => /\[([A-Z]+)(?:·([\d.]+))?\s+#(\d+)\]/.exec(line||"");

function handle(msg){
  if (msg.event !== "message" || seen.has(msg.id)) return false;
  seen.add(msg.id);
  S.lastId = msg.id;
  const title = msg.title || "", body = msg.message || "", t = msg.time*1000;
  const lines = body.split("\n");
  const avant = new Set(Object.keys(S.items));

  if (title.startsWith("🚨")) {                       // nouvel incident SANEF
    const tg = tagOf(lines[0]); if (!tg) return true;
    const num = tg[3];
    if (S.closed[num] && S.closed[num] >= t) return true;
    const desc = (body.split("\n\n")[1] || "").replace(/^\[[^\]]*\]\**\s*:\s*/, "").trim();
    const kr = /KM\s*([\d.,]+)\s*(?:au|et|à|-)\s*(?:KM\s*)?([\d.,]+)/i.exec(desc);
    S.items["N"+num] = {key:"N"+num, code:tg[1], km:tg[2]||"", kr: kr ? [kr[1], kr[2]].map(x => x.replace(/[.,]$/,"").replace(",",".")) : null, num, where:lines[0].replace(/\s+\[.*$/,"").trim(),
                        desc, at:coordsOf(body), t, src:"sanef"};
  }
  else if (title.startsWith("✅ RÉSOLU")) {            // incident SANEF terminé
    const tg = tagOf(lines[0]); if (!tg) return true;
    S.closed[tg[3]] = t; delete S.items["N"+tg[3]];
  }
  else if (title.startsWith("🚗 BOUCHON")) {           // bouchon Bison Futé
    const axe = (/BOUCHON\s+(.*?)\s+—/.exec(lines[0])||[])[1] || "";
    const deb = ((/^Debut\s*:\s*(.*?)(\s*\|.*)?$/m.exec(body))||[])[1] || "";
    const fin = ((/^Fin\s*:\s*(.*?)(\s*\|.*)?$/m.exec(body))||[])[1] || "";
    const key = "B|"+axe+"|"+deb+"->"+fin;
    const lng = (/Longueur\s*:\s*([^|\n]*)/.exec(body)||[])[1] || "";
    const att = (/Attente\s*:\s*(.*)/.exec(body)||[])[1] || "";
    S.items[key] = {key, code:"BOU", num:"", where:axe+" — "+lines[0].split("—").slice(1).join("—").trim(),
                    desc:"De "+deb+(fin?" à "+fin:"")+". Longueur "+lng.trim()+", attente "+att.trim()+".", len:parseFloat(lng)||0, sens:lines[0],
                    at:coordsOf(body), t, src:"bf"};
  }
  else if (title.startsWith("🔴 BOUCHON")) {           // bouchon vu sur la carte SANEF (début 📍 et fin 🏁)
    const a = coordsOf((/📍.*$/m.exec(body)||[""])[0]), b = coordsOf((/🏁.*$/m.exec(body)||[""])[0]);
    if (!a || !b) return true;
    const dir = (/direction\s+([^,\n]+)/i.exec(lines[0]) || [])[1] || "";
    for (const k in S.items) { const o = S.items[k]; if (o.src === "sb" && (o.dir || "") === dir && km(o.a || o.at, a) < 3) delete S.items[k]; }
    const key = "S|" + msg.id;
    S.items[key] = {key, code:"BOU", num:"", where:lines[0].replace(/^Secteur\s*/, "Secteur "),
                    desc:lines.slice(2).filter(l => l && !/https?:/.test(l)).join(" "),
                    at:a, a, b, dir, len:km(a, b), t, src:"sb"};   // at = queue du bouchon : là où on s'arrête
  }
  else if (title.startsWith("✅ BOUCHON RÉSOLU")) {
    const c = coordsOf(body);
    if (c) {
      let best = null, d = 3;
      for (const k in S.items) { const o = S.items[k]; if (o.src !== "sb") continue;
        const x = Math.min(km(o.at, c), o.b ? km([(o.a[0]+o.b[0])/2, (o.a[1]+o.b[1])/2], c) : 99); if (x < d) { d = x; best = k; } }
      if (best) delete S.items[best];
    }
    else {
      const m = /^(.*?)\s+—\s+(.*)$/.exec(lines[0]||"");
      if (m) delete S.items["B|"+m[1]+"|"+m[2]];
    }
  }
  else if (title.includes("BILAN ZONE")) {             // liste officielle des incidents actifs
    const actifs = new Set();
    for (const l of lines) {
      const tg = tagOf(l); if (!tg) continue;
      actifs.add(tg[3]);
      if (!S.items["N"+tg[3]] && !(S.closed[tg[3]] >= t)) {
        const where = (/ - (.*?)\s+https?:/.exec(l)||[])[1] || "";
        S.items["N"+tg[3]] = {key:"N"+tg[3], code:tg[1], km:tg[2]||"", num:tg[3], where, desc:"", at:null, t, src:"sanef"};
      }
    }
    for (const k in S.items) {
      const it = S.items[k];
      if (it.src === "sanef" && !actifs.has(it.num) && it.t < t) delete S.items[k];
    }
  }
  for (const k in S.items) if (!avant.has(k)) annonce(S.items[k]);
  return true;
}

// ---------- Annonce vocale (urgents seulement, carte ouverte) ----------
const OUVERTURE = Date.now();
const ancienVoix = store.get("sentinel_voix", false);
let voixNouv = store.get("sentinel_voix_nouv", ancienVoix);   // annonce des nouvelles alertes
let voixAppr = store.get("sentinel_voix_appr", ancienVoix);   // alerte d'approche à 5 km
function majBoutonVoix(){
  document.getElementById("voix").textContent = (voixNouv || voixAppr) ? "🔊" : "🔇";
  document.getElementById("rNouv").checked = voixNouv;
  document.getElementById("rAppr").checked = voixAppr;
}
function dire(txt){
  try { const u = new SpeechSynthesisUtterance(txt); u.lang = "fr-FR"; u.rate = 1; speechSynthesis.speak(u); } catch(e) {}
}
function annonce(it){
  if (!voixNouv || !URGENT.has(it.code) || it.t < OUVERTURE - 5000) return;   // pas les anciennes alertes
  const lieu = String(it.where || "").replace(/\s*\/\s*/g, ", ").replace(/\s*—\s*/g, ", ");
  let txt = "Attention, " + (NAMES[it.code] || "incident").toLowerCase() + ", " + lieu;
  if (me && it.at) txt += ", à " + Math.round(km(me, it.at)) + " kilomètres";
  dire(txt + ".");
}

function purge(){
  const now = Date.now();
  for (const k in S.items) {
    const it = S.items[k];
    if (now - it.t > (it.src === "bf" || it.src === "sb" ? KEEP_BOU_MS : KEEP_MS)) delete S.items[k];
  }
  for (const n in S.closed) if (now - S.closed[n] > KEEP_MS) delete S.closed[n];
}

// ---------- Tracé des bouchons sur la route ----------
// Direction : la ville vers laquelle roule le bouchon (texte « sens » de Bison Futé).
const CITIES = [["strasbourg",48.58,7.75],["sarrebruck",49.23,6.99],["allemagne",49.23,6.99],["saarbr",49.23,6.99],
  ["luxembourg",49.61,6.13],["thionville",49.36,6.17],["metz",49.12,6.18],["nancy",48.69,6.18],["dijon",47.32,5.04],
  ["paris",48.85,2.35],["reims",49.26,4.03],["forbach",49.19,6.90],["saint-avold",49.10,6.70],["sarreguemines",49.11,7.07]];
const tracing = new Set();
function targetOf(sens){
  const t = (sens||"").toLowerCase(), v = t.lastIndexOf("vers");
  const zone = v >= 0 ? t.slice(v) : t;
  let best = null, pos = 1e9;
  for (const c of CITIES) { const i = zone.indexOf(c[0]); if (i >= 0 && i < pos) { pos = i; best = c; } }
  return best;
}
async function osrm(a, b){
  const u = `https://router.project-osrm.org/route/v1/driving/${a[1]},${a[0]};${b[1]},${b[0]}?overview=full&geometries=geojson`;
  const j = await (await fetch(u)).json();
  return {pts: j.routes[0].geometry.coordinates.map(p => [p[1], p[0]]), km: j.routes[0].distance/1000};
}
async function traceSB(it){                                 // de 📍 à 🏁 en suivant la route, dans un sens ou l'autre
  if (tracing.has(it.key)) return;
  tracing.add(it.key);
  let line = [it.a, it.b];
  try {
    const d = km(it.a, it.b), r1 = await osrm(it.a, it.b);
    if (r1.km < d*1.6 + 0.5) line = r1.pts;
    else { const r2 = await osrm(it.b, it.a); if (r2.km < d*1.6 + 0.5) line = r2.pts; }
  } catch(e) {}
  if (S.items[it.key]) { S.items[it.key].line = line; render(); }
  tracing.delete(it.key);
}
async function traceJam(it){
  if (it.src === "sb") return traceSB(it);
  if (!it.at || !it.len || tracing.has(it.key)) return;
  const c = targetOf(it.sens); if (!c) return;
  tracing.add(it.key);
  try {
    const u = `https://router.project-osrm.org/route/v1/driving/${it.at[1]},${it.at[0]};${c[2]},${c[1]}?overview=full&geometries=geojson`;
    const j = await (await fetch(u)).json();
    const pts = j.routes[0].geometry.coordinates.map(p => [p[1], p[0]]);
    const line = [pts[0]]; let d = 0;                       // on garde la longueur du bouchon
    for (let i = 1; i < pts.length && d < it.len; i++) {
      const s = km(pts[i-1], pts[i]);
      if (d + s > it.len) { const f = (it.len - d)/s; line.push([pts[i-1][0]+(pts[i][0]-pts[i-1][0])*f, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*f]); break; }
      line.push(pts[i]); d += s;
    }
    if (S.items[it.key]) { S.items[it.key].line = line; render(); }
  } catch(e) {} finally { tracing.delete(it.key); }
}

// ---------- Carte ----------
const map = L.map("map", {zoomControl:false, attributionControl:true}).setView([49.1, 6.4], 9);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",   // passé en gris (CSS) : aucune route en rouge
  {maxZoom:18, className:"fond", attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
// Couleurs du trafic SANEF (vert fluide, orange lent, rouge arrêté) : SENTINEL publie le code du jour sur <canal>-etat
let etat = null, etatHash = null;
async function majEtat(){
  const topic = store.get("sentinel_topic", ""); if (!topic) return;
  try {
    const txt = await (await fetch(`https://ntfy.sh/${encodeURIComponent(topic)}-etat/json?poll=1&since=3h`)).text();
    const last = txt.trim().split("\n").filter(Boolean).map(l => JSON.parse(l)).filter(m => m.event === "message").pop();
    const h = last && /^[0-9A-F]{8}$/i.test(last.message.trim()) ? last.message.trim() : store.get("sentinel_etat", null);
    if (last) noteVie(last.time);
    setEtat(h);
    if (!etatES) {                         // le code change toutes les ~5 min : on le suit en direct
      etatES = new EventSource(`https://ntfy.sh/${encodeURIComponent(topic)}-etat/sse`);
      etatES.onmessage = e => { try { const m = JSON.parse(e.data); if (m.event === "message") noteVie(m.time); if (/^[0-9A-F]{8}$/i.test((m.message||"").trim())) setEtat(m.message.trim()); } catch(err) {} };
    }
  } catch(e) {}
}
let etatES = null;
function setEtat(h){
  if (!h || h === etatHash) return;
  etatHash = h; store.set("sentinel_etat", h);
  const old = etat;                        // la nouvelle couche remplace l'ancienne une fois chargée (pas de clignotement)
  etat = L.tileLayer(`https://wt3.autoroutes-trafic.fr//realtime/trafficstate/${h}/{z}/{x}/{y}.png`,
    {maxNativeZoom:12, maxZoom:18, zIndex:5,   // SANEF ne dessine pas au-dela du zoom 12
     errorTileUrl:"data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7",  // tuile vide = transparente
     attribution:"Trafic © Autoroutes Trafic / SANEF"}).addTo(map);
  if (old) { etat.once("load", () => map.removeLayer(old)); setTimeout(() => map.hasLayer(old) && map.removeLayer(old), 8000); }
}
majEtat(); setInterval(majEtat, 5*60e3);
L.control.zoom({position:"bottomright"}).addTo(map);
const layer = L.layerGroup().addTo(map);
const markers = {};
let me = null, meMarker = null;

const esc = s => String(s||"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const hhmm = t => new Date(t).toLocaleString("fr-FR", {weekday:"short", hour:"2-digit", minute:"2-digit"});
function km(a, b){
  const R = 6371, r = x => x*Math.PI/180;
  const d = Math.sin(r(b[0]-a[0])/2)**2 + Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(r(b[1]-a[1])/2)**2;
  return 2*R*Math.asin(Math.sqrt(d));
}
function span(it){
  if (it.kr) { const L_ = Math.abs(it.kr[1]-it.kr[0]); return `du km ${it.kr[0]} au km ${it.kr[1]} (${L_.toFixed(1).replace(".",",")} km)`; }
  return it.km ? "km " + it.km : "";
}
function popup(it){
  const nav = it.at ? `<a href="https://www.google.com/maps/dir/?api=1&destination=${it.at[0]},${it.at[1]}" target="_blank" rel="noopener">Itinéraire</a>` : "";
  return `<div class="pop"><h3>${esc(NAMES[it.code]||it.code)}</h3>${span(it)?`<div class="span">${esc(span(it))}</div>`:""}
    <div>${esc(it.where)}</div>${it.desc?`<p>${esc(it.desc.replace(/^De (.+?) à \1\./, "À $1."))}</p>`:""}
    <div class="when">Signalé ${esc(hhmm(it.t))}${it.num?" · #"+esc(it.num):""}</div>${nav}</div>`;
}

function render(){
  purge(); save();
  layer.clearLayers();
  for (const k in markers) delete markers[k];
  const items = Object.values(S.items);
  for (const it of items) {
    if (!it.at) continue;
    const big = URGENT.has(it.code);
    let html = `<div class="pin${big?" big":" calm"}" style="border-color:${colorOf(it.code)}${big?";background:"+colorOf(it.code):""}">${ico(it.code)}</div>`;
    if (it.src === "sb" && it.a && it.b) {           // sens de circulation : flèche + « → Metz »
      const cap = Math.atan2((it.b[1]-it.a[1]) * Math.cos(it.a[0]*Math.PI/180), it.b[0]-it.a[0]) * 180/Math.PI;
      html = `<div class="sens" style="transform:rotate(${cap}deg)"><span>▲</span></div>` + html +
             (it.dir ? `<div class="dirtag">→ ${esc(it.dir)}</div>` : "");
    }
    const icon = L.divIcon({className:"", iconSize:big?[38,38]:[30,30], html});
    if (it.code === "BOU" && it.src !== "sb") {          // (bouchon SANEF : déjà en rouge sur la couche SANEF)                               // bouchon tracé en rouge sur la route, sur sa longueur
      if (it.line) L.polyline(it.line, {color:colorOf("BOU"), weight:9, opacity:.85, lineCap:"round"}).addTo(layer);
      else traceJam(it);
    }
    markers[it.key] = L.marker(it.at, {icon, zIndexOffset: big?1000:0}).bindPopup(popup(it)).addTo(layer);
  }
  const urg = items.filter(i => URGENT.has(i.code)).length;
  document.getElementById("count").textContent = items.length + " en cours" + (urg ? " · " + urg + " urgent" + (urg>1?"s":"") : "");
  // liste : par distance si position connue, sinon urgents puis récents
  items.sort((a,b) => me && a.at && b.at ? km(me,a.at) - km(me,b.at)
                    : (URGENT.has(b.code) - URGENT.has(a.code)) || b.t - a.t);
  const list = document.getElementById("list");
  list.innerHTML = items.length ? "" : '<div class="empty">Aucun incident en cours.</div>';
  for (const it of items) {
    const row = document.createElement("div");
    row.className = "row";
    const dist = me && it.at ? Math.round(km(me, it.at)) + " km" : (it.at ? "" : "sans position");
    row.innerHTML = `<div class="tag" style="background:${colorOf(it.code)}">${ico(it.code)} ${esc(it.code)}</div>
      <div class="t"><b>${esc(it.where)}</b><small>${esc(NAMES[it.code]||it.code)}${span(it)?" · "+esc(span(it)):""} · ${esc(hhmm(it.t))}</small></div>
      <div class="d">${esc(dist)}</div>`;
    row.onclick = () => { if (!it.at) return; document.getElementById("handle").click(); map.flyTo(it.at, 14); setTimeout(() => markers[it.key] && markers[it.key].openPopup(), 600); };
    list.appendChild(row);
  }
}

// ---------- Connexion au canal ----------
let es = null, timer = null;
// Voyant : SENTINEL envoie un signal (code couleurs) à chaque scan, toutes les 5 min.
let vie = store.get("sentinel_vie", 0), reseau = true;
function noteVie(t){ if (t*1000 > vie) { vie = t*1000; store.set("sentinel_vie", vie); voyant(); } }
function voyant(){
  const dot = document.getElementById("dot"), txt = document.getElementById("vie");
  const min = Math.round((Date.now() - vie) / 60e3);
  if (!reseau)        { dot.className = "";     txt.className = "";   txt.textContent = "pas de réseau"; }
  else if (!vie)      { dot.className = "";     txt.className = "";   txt.textContent = "en attente de SENTINEL"; }
  else if (min <= 12) { dot.className = "live"; txt.className = "ok"; txt.textContent = "SENTINEL actif"; }
  else { dot.className = "off"; txt.className = "ko";
         txt.textContent = "SENTINEL arrêté depuis " + (min < 120 ? min + " min" : Math.round(min/60) + " h"); }
}
setInterval(voyant, 30e3);
function setDot(c){ reseau = (c === "live"); voyant(); }
function connect(topic){
  if (es) es.close();
  const since = S.lastId || "12h";
  es = new EventSource(`https://ntfy.sh/${encodeURIComponent(topic)}/sse?since=${encodeURIComponent(since)}`);
  es.onopen = () => setDot("live");
  es.onmessage = e => {
    let m; try{ m = JSON.parse(e.data); }catch(err){ return; }
    if (m.event === "message") noteVie(m.time);
    if (handle(m)) { clearTimeout(timer); timer = setTimeout(render, 150); }
  };
  es.onerror = () => {                // EventSource se reconnecte tout seul, sauf si ntfy refuse (400)
    setDot("off");
    if (es.readyState === 2) {        // ex. : dernier message trop ancien, plus connu de ntfy -> on repart des 12 dernières heures
      S.lastId = null; save();
      setTimeout(() => connect(topic), 5000);
    }
  };
}

// ---------- Position ----------
document.getElementById("voix").onclick = () => document.getElementById("reglages").classList.toggle("ouvert");
map.on("click", () => document.getElementById("reglages").classList.remove("ouvert"));   // toucher la carte ferme le menu
document.getElementById("rNouv").onchange = e => {
  voixNouv = e.target.checked; store.set("sentinel_voix_nouv", voixNouv); majBoutonVoix();
  if (voixNouv) dire("Annonce des nouvelles alertes activée."); else try { speechSynthesis.cancel(); } catch(err) {}
};
document.getElementById("rAppr").onchange = e => {
  voixAppr = e.target.checked; store.set("sentinel_voix_appr", voixAppr); majBoutonVoix();
  if (voixAppr) { dire("Alerte d'approche activée."); if (!me) document.getElementById("locate").click(); }
  else try { speechSynthesis.cancel(); } catch(err) {}
};
majBoutonVoix();
// ---------- Alerte d'approche : annonce à 5 km d'un urgent, quand on s'en rapproche, une fois ----------
const APPROCHE_KM = 5;
const derniereDist = {};
let dejaPrevenu = store.get("sentinel_prevenu", {});
function approche(){
  if (!voixAppr || !me) return;
  for (const it of Object.values(S.items)) {
    if (!URGENT.has(it.code) || !it.at) continue;
    const d = km(me, it.at), avant = derniereDist[it.key];
    derniereDist[it.key] = d;
    if (dejaPrevenu[it.key] || avant === undefined) continue;
    if (d <= APPROCHE_KM && d < avant - 0.05) {          // dans la zone ET en train de s'en rapprocher
      dejaPrevenu[it.key] = Date.now();
      for (const k in dejaPrevenu) if (Date.now() - dejaPrevenu[k] > 24*3600e3) delete dejaPrevenu[k];
      store.set("sentinel_prevenu", dejaPrevenu);
      const lieu = String(it.where || "").replace(/\s*\/\s*/g, ", ").replace(/\s*—\s*/g, ", ");
      dire("Attention, " + (NAMES[it.code] || "incident").toLowerCase() + " à " + Math.max(1, Math.round(d)) + " kilomètres, " + lieu + ".");
    }
  }
}
let suivi = null;
document.getElementById("locate").onclick = () => {
  if (!navigator.geolocation || suivi !== null) { if (me) map.flyTo(me, 11); return; }
  suivi = navigator.geolocation.watchPosition(p => {
    const first = !me;
    me = [p.coords.latitude, p.coords.longitude];
    if (!meMarker) meMarker = L.marker(me, {icon:L.divIcon({className:"", html:'<div class="me"></div>', iconSize:[22,22]}), zIndexOffset:2000}).addTo(map);
    else meMarker.setLatLng(me);
    if (first) { if (!cible) map.flyTo(me, 11); render(); }
    approche();
  }, () => {}, {enableHighAccuracy:true, maximumAge:15000});
};
if (voixAppr) setTimeout(() => document.getElementById("locate").click(), 1500);   // voix active : on suit la position dès l'ouverture

// ---------- Feuille du bas ----------
document.getElementById("handle").onclick = () => {
  const sh = document.getElementById("sheet");
  sh.classList.toggle("closed");
  document.getElementById("sort").textContent = sh.classList.contains("closed") ? "▲ ouvrir" : "▼ fermer";
};

// ---------- Démarrage ----------
let cible = null;                          // lien d'alerte : #c=<canal>&q=<lat>,<lon> -> carte zoomée sur l'incident
function zoomCible(){
  if (!cible) return;
  map.setView(cible, 14);
  let best = null, d = 1.5;                // ouvre la fiche de l'incident le plus proche (< 1,5 km)
  for (const k in markers) { const x = km(cible, [markers[k].getLatLng().lat, markers[k].getLatLng().lng]); if (x < d) { d = x; best = k; } }
  if (best) { markers[best].openPopup(); cible = null; }
}
function start(){
  const h = decodeURIComponent(location.hash.slice(1));
  let topic = store.get("sentinel_topic", "");
  if (h.startsWith("c=")) {
    const p = new URLSearchParams(h);
    topic = p.get("c") || topic;
    const q = coordsOf("q=" + (p.get("q") || ""));
    if (q) cible = q;
  } else if (h) topic = h;
  if (h) { store.set("sentinel_topic", topic); history.replaceState(null, "", location.pathname); }
  if (!topic) {
    document.getElementById("setup").style.display = "flex";
    document.getElementById("save").onclick = () => {
      const v = document.getElementById("topic").value.trim();
      if (!v) return;
      store.set("sentinel_topic", v);
      document.getElementById("setup").style.display = "none";
      connect(v);
    };
  } else connect(topic);
  render();
  zoomCible();
  setTimeout(zoomCible, 3000);             // si l'alerte arrive juste après l'ouverture
}
start();
addEventListener("hashchange", () => location.reload());
setInterval(render, 60e3);   // purge et heures relatives

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
